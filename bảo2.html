<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Biểu mẫu khảo sát ITviec</title>
    <style>
        body {
            font-family: Arial;
            background: #00b36b;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 500px;
            margin: 40px auto;
            background: #fff;
            padding: 25px;
            border-radius: 5px;
        }
        h2 {
            text-align: center;
            color: white;
            margin-top: 20px;
        }
        .wrapper {
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        textarea {
            height: 80px;
        }
        .radio-group, .checkbox-group {
            margin-top: 5px;
        }
        .radio-group label,
        .checkbox-group label {
            display: block;
            margin-bottom: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #00b36b;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #00995c;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <h2>Biểu mẫu khảo sát ITviec</h2>
    <div class="container">
        <form>
            <div class="form-group">
                <label>Họ tên</label>
                <input type="text" placeholder="Nhập tên của bạn">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Nhập email của bạn">
            </div>
            <div class="form-group">
                <label>Tuổi</label>
                <input type="number" placeholder="Nhập tuổi">
            </div>
            <div class="form-group">
                <label>Hiện tại bạn đang là?</label>
                <select>
                    <option>Học sinh/Sinh viên</option>
                    <option>Nhân viên</option>
                    <option>Freelancer</option>
                    <option>Khác</option>
                </select>
            </div>
            <div class="form-group">
                <label>Bạn sẽ giới thiệu ITviec với bạn bè chứ?</label>
                <div class="radio-group">
                    <label><input type="radio" name="gioithieu"> Có</label>
                    <label><input type="radio" name="gioithieu"> Không</label>
                    <label><input type="radio" name="gioithieu"> Có thể</label>
                </div>
                </div>
            <div class="form-group">
                <label>Ngôn ngữ lập trình và Framework bạn đã biết? (Có thể chọn nhiều)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox"> C</label>
                    <label><input type="checkbox"> C++</label>
                    <label><input type="checkbox"> C#</label>
                </div>
            </div>
            <div class="form-group">
                <label>Bạn có câu hỏi gì cho ITviec không?</label>
                <textarea placeholder="Enter your comment here"></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</div>
</body>
</html>
